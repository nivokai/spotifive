[package]
name = "spotifive"
version = "0.1.0"
description = "Lecteur de musique libre et gratuit"
authors = ["nivokai"]
edition = "2021"

[lib]
name = "spotifive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls", "gzip", "brotli", "http2"] }
tokio = { version = "1", features = ["fs", "sync", "macros", "rt-multi-thread"] }
lofty = "0.22"
walkdir = "2"
rayon = "1"
thiserror = "2"

# Réglages orientés vitesse d'exécution et taille de l'exe
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
